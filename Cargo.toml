[package]
name = "fetch-rs"
version = "0.1.0"
edition = "2024"
description = "Rust port of the fetch system-info tool: a rotating 3D logo plus OS/host/kernel/CPU/GPU/memory/disk/IP/battery info"
license = "MIT"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console"] }

[profile.release]
opt-level = 3
